[workspace]
members = ["crates/qb-core", "crates/qb-proto", "crates/qb-testkit", "crates/qb-tray", "crates/quota-baton"]
resolver = "2"
exclude = ["vendor/tungstenite"]

[patch.crates-io]
tungstenite = { path = "vendor/tungstenite" }

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "=1.0.100"
axum = { version = "=0.8.6", features = ["ws"] }
tokio-tungstenite = { version = "=0.28.0", features = ["rustls-tls-webpki-roots"] }
hyper = { version = "=1.12.0", features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
base64 = "=0.22.1"
chrono = { version = "=0.4.42", features = ["serde"] }
clap = { version = "=4.5.51", features = ["derive"] }
fs2 = "=0.4.3"
rand = "=0.9.2"
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }
http-body-util = "0.1"
bytes = "=1.10.1"
futures-util = "=0.3.31"
async-stream = "=0.3.6"
zstd = "=0.13.3"
flate2 = "=1.1.5"
brotli = "=8.0.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["preserve_order"] }
sha2 = "=0.10.9"
subtle = "=2.6.1"
tempfile = "=3.23.0"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["full"] }
toml = "=0.9.8"
toml_edit = "=0.23.10"
tracing = "=0.1.41"
tracing-appender = "=0.2.3"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter", "json"] }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Memory", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Imaging", "Win32_Graphics_Dxgi_Common", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_HiDpi", "Win32_System_Registry"] }
windows-numerics = "0.3.1"
zeroize = { version = "=1.8.2", features = ["derive"] }
qb-core = { path = "crates/qb-core" }
qb-proto = { path = "crates/qb-proto" }
qb-testkit = { path = "crates/qb-testkit" }

# Disk hygiene (C: is nearly full): keep line tables for panic locations, drop full debug info.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
